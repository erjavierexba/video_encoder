name: Build and release Windows and Ubuntu executables

on:
  workflow_dispatch:
  push:
    tags:
      - "*ALPHA*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PySide6 pyinstaller

      - name: Download static FFmpeg for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist

          $ffmpeg = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $ffmpeg) { throw "No se encontró ffmpeg.exe" }
          if (-not $ffprobe) { throw "No se encontró ffprobe.exe" }

          Copy-Item $ffmpeg.FullName .\ffmpeg.exe
          Copy-Item $ffprobe.FullName .\ffprobe.exe

      - name: Build encoder and decoder
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name uvhide-encoder `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            uvhide_encode_5x.py

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name uvhide-decoder `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            uvhide_decode.py

      - name: End-to-end smoke test
        shell: pwsh
        run: |
          .\dist\uvhide-encoder.exe --help
          .\dist\uvhide-decoder.exe --help

          .\ffmpeg.exe `
            -y `
            -f lavfi `
            -i "testsrc2=size=640x360:rate=30" `
            -t 1 `
            -pix_fmt yuv420p `
            test_input.mp4

          .\dist\uvhide-encoder.exe test_input.mp4 "HOLA" -o test_encoded.mp4

          $decodedOutput = & .\dist\uvhide-decoder.exe test_encoded.mp4 --text 2>&1
          $decoderExitCode = $LASTEXITCODE
          $decodedOutput | ForEach-Object { Write-Host $_ }

          if ($decoderExitCode -ne 0) {
            throw "El decoder terminó con el código $decoderExitCode."
          }

          $decoded = ($decodedOutput | Select-Object -Last 1).ToString().Trim()
          if ($decoded -ne "HOLA") {
            throw "El decoder devolvió '$decoded' en vez de 'HOLA'."
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\dist\uvhide-encoder.exe, .\dist\uvhide-decoder.exe `
            -DestinationPath .\uvhide-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: uvhide-windows-x64
          path: uvhide-windows-x64.zip

  build-ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PySide6 pyinstaller

      - name: Download static FFmpeg for Ubuntu
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          curl --fail --location "$url" --output ffmpeg.tar.xz
          mkdir ffmpeg-dist
          tar -xf ffmpeg.tar.xz -C ffmpeg-dist

          cp "$(find ffmpeg-dist -type f -name ffmpeg -print -quit)" ./ffmpeg
          cp "$(find ffmpeg-dist -type f -name ffprobe -print -quit)" ./ffprobe
          chmod +x ./ffmpeg ./ffprobe

      - name: Build encoder and decoder
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --console \
            --name uvhide-encoder \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            uvhide_encode_5x.py

          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --console \
            --name uvhide-decoder \
            --add-binary "ffmpeg:." \
            --add-binary "ffprobe:." \
            uvhide_decode.py

      - name: End-to-end smoke test
        run: |
          set -euo pipefail
          ./dist/uvhide-encoder --help
          ./dist/uvhide-decoder --help

          ./ffmpeg \
            -loglevel error \
            -y \
            -f lavfi \
            -i "testsrc2=size=640x360:rate=30" \
            -t 1 \
            -pix_fmt yuv420p \
            test_input.mp4

          ./dist/uvhide-encoder test_input.mp4 "HOLA" -o test_encoded.mp4
          decoded="$(./dist/uvhide-decoder test_encoded.mp4 --text)"
          test "$decoded" = "HOLA"

      - name: Create Ubuntu ZIP
        run: zip -j uvhide-ubuntu-x64.zip dist/uvhide-encoder dist/uvhide-decoder

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: uvhide-ubuntu-x64
          path: uvhide-ubuntu-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v5
        with:
          pattern: uvhide-*-x64
          path: release-files
          merge-multiple: true

      - name: Remove superseded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" uvhide-encoder.exe --yes || true
          gh release delete-asset "$GITHUB_REF_NAME" uvhide-decoder.exe --yes || true
          gh release delete-asset "$GITHUB_REF_NAME" uvhide-windows-x64.zip --yes || true
          gh release delete-asset "$GITHUB_REF_NAME" uvhide-ubuntu-x64.zip --yes || true

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release-files/*.zip
