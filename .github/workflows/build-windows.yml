name: Build and release Windows executables

on:
  workflow_dispatch:
  push:
    tags:
      - "*ALPHA*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy PySide6 pyinstaller

      - name: Download static FFmpeg for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist

          $ffmpeg = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $ffmpeg) { throw "No se encontró ffmpeg.exe" }
          if (-not $ffprobe) { throw "No se encontró ffprobe.exe" }

          Copy-Item $ffmpeg.FullName .\ffmpeg.exe
          Copy-Item $ffprobe.FullName .\ffprobe.exe

      - name: Build encoder and decoder
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name uvhide-encoder `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            uvhide_encode_5x.py

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name uvhide-decoder `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            uvhide_decode.py

      - name: End-to-end smoke test
        shell: pwsh
        run: |
          .\dist\uvhide-encoder.exe --help
          .\dist\uvhide-decoder.exe --help

          .\ffmpeg.exe `
            -y `
            -f lavfi `
            -i "testsrc2=size=640x360:rate=30" `
            -t 1 `
            -pix_fmt yuv420p `
            test_input.mp4

          .\dist\uvhide-encoder.exe `
            test_input.mp4 `
            "HOLA" `
            -o test_encoded.mp4

          $decodedOutput = & .\dist\uvhide-decoder.exe test_encoded.mp4 --text 2>&1
          $decoderExitCode = $LASTEXITCODE
          $decodedOutput | ForEach-Object { Write-Host $_ }

          if ($decoderExitCode -ne 0) {
            throw "El decoder terminó con el código $decoderExitCode."
          }

          $decoded = ($decodedOutput | Select-Object -Last 1).ToString().Trim()
          if ($decoded -ne "HOLA") {
            throw "El decoder devolvió '$decoded' en vez de 'HOLA'."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uvhide-windows-x64
          path: |
            dist/uvhide-encoder.exe
            dist/uvhide-decoder.exe

      - name: Create GitHub prerelease
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/uvhide-encoder.exe
            dist/uvhide-decoder.exe
