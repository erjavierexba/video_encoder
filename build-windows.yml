name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "uvhide_encode_5x.py"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyinstaller

      - name: Download static FFmpeg for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dist

          $ffmpeg = Get-ChildItem ffmpeg-dist -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-dist -Recurse -Filter ffprobe.exe | Select-Object -First 1

          if (-not $ffmpeg) { throw "No se encontró ffmpeg.exe" }
          if (-not $ffprobe) { throw "No se encontró ffprobe.exe" }

          Copy-Item $ffmpeg.FullName .\ffmpeg.exe
          Copy-Item $ffprobe.FullName .\ffprobe.exe

      - name: Build uvhide-encoder.exe
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name uvhide-encoder `
            --add-binary "ffmpeg.exe;." `
            --add-binary "ffprobe.exe;." `
            uvhide_encode_5x.py

      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\uvhide-encoder.exe --help

          .\ffmpeg.exe `
            -y `
            -f lavfi `
            -i "testsrc2=size=640x360:rate=30" `
            -t 1 `
            -pix_fmt yuv420p `
            test_input.mp4

          .\dist\uvhide-encoder.exe `
            test_input.mp4 `
            "HOLA" `
            -o test_encoded.mp4

          if (-not (Test-Path .\test_encoded.mp4)) {
            throw "El encoder no generó el MP4 de prueba."
          }

          if ((Get-Item .\test_encoded.mp4).Length -le 0) {
            throw "El MP4 de prueba está vacío."
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: uvhide-encoder-windows-x64
          path: dist/uvhide-encoder.exe
